<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Instituciones Educativas · B.U.D.I.E.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#ffffff; --bg-alt:#f6f7f9; --ink:#14171a; --ink-soft:#5b6470; --line:#e5e8eb;
  --brand:#009DE0; --brand-d:#0079ac; --brand-bg:#dbf1fb;
  
  /* Paleta institucional Río Cuarto */
  --c-educacion:#00C96B; --c-gobierno:#F2C100; --c-salud:#F27C00; --c-deporte:#FF3CB2;
  --c-nutricion:#E63946; --c-alertas:#d32f2f; --c-vecinal:#00B8A9;
  
  /* Niveles y Sectores */
  --c-inicial:#009DE0; --c-primario:#00C96B; --c-secundario:#F27C00; 
  --c-superior:#FF3CB2; --c-especial:#6C63FF; --c-adultos:#2563EB; --c-otros:#718096;
  
  --c-publico:#009DE0; --c-privado:#FF3CB2; --c-municipal:#00C96B;
  
  /* Tints suaves */
  --tint-verde:#dbf7ea; --tint-amarillo:#fdf6db; --tint-naranja:#fdeddb; 
  --tint-magenta:#ffe4f4; --tint-teal:#d9f5f1; --tint-morado:#e8e6ff; 
  --tint-azulgris:#e4e9ec; --tint-sky:#e0f2fe; --tint-rojo:#ffebee;
  
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 1px 12px rgba(20,23,26,.08);
  --shadow-lift:0 6px 20px rgba(20,23,26,.12), 0 2px 6px rgba(20,23,26,.08);
  --ease-standard:cubic-bezier(.4,0,.2,1); --ease-decel:cubic-bezier(0,0,.2,1);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --bg-alt:#171b21; --ink:#eef1f4; --ink-soft:#a3adb8; --line:#262c34; --brand-bg:#102d39;
    --tint-verde:#103524; --tint-amarillo:#3c3310; --tint-naranja:#3c2710; 
    --tint-magenta:#3e1b30; --tint-teal:#0f2e2a; --tint-morado:#241f3d; 
    --tint-azulgris:#23292d; --tint-sky:#0c4a6e; --tint-rojo:#3e1616;
  }
}

.material-symbols-outlined{
  font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
  font-size:18px;line-height:1;display:inline-block;vertical-align:-3px;
  -webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Google Sans","Product Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px}

/* ---------- TOPBAR ---------- */
.topbar{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:30}
.topbar .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo img.logo-muni{height:42px;max-height:42px;width:auto;display:block}
.mapbar-row{display:flex;flex:1;flex-wrap:wrap;align-items:center;gap:10px 16px;min-width:0}
.title-block{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.title-block h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em;color:var(--ink)}
.title-block span{font-size:11.5px;color:var(--ink-soft);font-weight:600}

/* ---------- TOPBAR SEARCH BAR ---------- */
.topbar-search-wrap{
  position:relative;
  flex:1;
  max-width:400px;
  min-width:240px;
}
.topbar-search-box{
  position:relative;
  display:flex;
  align-items:center;
  background:var(--bg-alt);
  border:1px solid var(--line);
  border-radius:999px;
  padding:0 10px 0 14px;
  height:38px;
  transition:all .18s var(--ease-standard);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.topbar-search-box:focus-within{
  background:var(--bg);
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-bg), 0 2px 8px rgba(0,157,224,.12);
}
.topbar-search-box .search-icon{
  font-size:18px;
  color:var(--ink-soft);
  margin-right:8px;
  flex-shrink:0;
  transition:color .18s;
}
.topbar-search-box:focus-within .search-icon{
  color:var(--brand-d);
}
.topbar-search-input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  font-family:inherit;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
  min-width:0;
}
.topbar-search-input::placeholder{
  color:var(--ink-soft);
  font-weight:500;
}
.topbar-search-clear{
  background:transparent;
  border:none;
  padding:2px;
  cursor:pointer;
  color:var(--ink-soft);
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  margin-left:4px;
  transition:all .15s;
}
.topbar-search-clear:hover{
  background:var(--line);
  color:var(--ink);
}
.topbar-search-clear.visible{
  display:flex;
}

/* Autocomplete Dropdown */
.search-dropdown{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.06);
  max-height:360px;
  overflow-y:auto;
  z-index:1100;
  display:none;
  padding:6px;
}
.search-dropdown.open{
  display:block;
}
.search-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  transition:background .15s var(--ease-standard);
  text-align:left;
  user-select:none;
}
.search-item:hover, .search-item.selected{
  background:var(--bg-alt);
}
.search-item .item-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  flex-shrink:0;
}
.search-item .item-info{
  flex:1;
  min-width:0;
}
.search-item .item-title{
  font-size:12.5px;
  font-weight:700;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.search-item .item-meta{
  font-size:11px;
  color:var(--ink-soft);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:1px;
}
.search-item .item-badge{
  font-size:10px;
  font-weight:700;
  padding:2px 7px;
  border-radius:999px;
  flex-shrink:0;
}
.search-dropdown-footer{
  padding:8px 12px 6px;
  font-size:11px;
  font-weight:700;
  color:var(--ink-soft);
  border-top:1px solid var(--line);
  margin-top:4px;
  display:flex;
  justify-content:space-between;
}
.search-no-results{
  padding:14px;
  text-align:center;
  color:var(--ink-soft);
  font-size:12px;
  font-weight:600;
}

.back-link{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--brand-d);text-decoration:none;padding:6px 14px;border-radius:999px;
  background:var(--brand-bg);transition:all .15s var(--ease-standard);
  flex-shrink:0;
}
.back-link:hover{background:#c5e9f9;transform:translateY(-1px)}
.back-link .material-symbols-outlined{font-size:16px;margin:0}

.sync-btn{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  letter-spacing:.02em;color:var(--brand-d);background:var(--brand-bg);
  border:1px solid rgba(0,157,224,.35);padding:6px 14px;border-radius:999px;
  cursor:pointer;transition:all .18s var(--ease-standard);user-select:none;
}
.sync-btn:hover{
  background:#c7eafc;border-color:var(--brand);transform:translateY(-1px);
  box-shadow:0 3px 10px rgba(0,157,224,.25);color:var(--brand-d);
}
.sync-btn:active{transform:scale(.95)}
.sync-btn .sync-icon{font-size:16px;margin:0;transition:transform .3s ease}
.sync-btn.loading{opacity:.85;pointer-events:none}
.sync-btn.loading .sync-icon{animation:spinSync .8s linear infinite}
.sync-btn.success{background:var(--tint-verde);color:var(--c-educacion);border-color:rgba(0,201,107,.4)}
.sync-btn.error{background:var(--tint-rojo);color:var(--c-alertas);border-color:rgba(211,47,47,.4)}

@keyframes spinSync{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.toast-msg{
  position:fixed;bottom:24px;right:24px;z-index:99999;
  background:#14171a;color:#ffffff;padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transform:translateY(16px);
  pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1);
}
.toast-msg.show{opacity:1;transform:translateY(0)}
.toast-msg .material-symbols-outlined{color:var(--c-educacion);font-size:18px;margin:0}
.toast-msg.toast-err .material-symbols-outlined{color:#ff5252}

/* ---------- MAIN LAYOUT ---------- */
.app{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0}
.leaflet-container{font-family:inherit;background:#e5e9ec}

/* Leaflet Custom Layer Switcher */
.leaflet-control-layers{
  border-radius:12px !important;
  border:1px solid var(--line) !important;
  box-shadow:0 4px 16px rgba(0,0,0,.12) !important;
  font-family:"Google Sans",sans-serif !important;
  font-size:12px !important;
  font-weight:600 !important;
  padding:8px 12px !important;
  background:var(--bg) !important;
  color:var(--ink) !important;
}
.leaflet-control-layers-expanded{
  padding:10px 14px !important;
}
.leaflet-control-layers-base label{
  display:flex;
  align-items:center;
  gap:6px;
  margin:4px 0;
  cursor:pointer;
}

/* ---------- COLLAPSIBLE ATTRIBUTION (INFO ICON) ---------- */
.custom-attribution{
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  margin:0 10px 10px 0;
  position:relative;
}
.custom-attribution-btn{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#ffffff;
  box-shadow:0 2px 7px rgba(0,0,0,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border:1px solid rgba(0,0,0,.1);
  padding:0;
  color:#14171a;
  transition:all .2s var(--ease-standard);
  flex-shrink:0;
}
.custom-attribution-btn:hover, .custom-attribution.expanded .custom-attribution-btn{
  transform:scale(1.08);
  box-shadow:0 3px 10px rgba(0,0,0,.28);
}
.custom-attribution-btn svg{
  width:18px;
  height:18px;
  display:block;
}
.custom-attribution-content{
  max-width:0;
  opacity:0;
  overflow:hidden;
  white-space:nowrap;
  background:rgba(255, 255, 255, 0.96);
  backdrop-filter:blur(8px);
  padding:0;
  border-radius:999px;
  box-shadow:0 3px 12px rgba(0,0,0,.14);
  border:1px solid var(--line);
  font-size:11px;
  font-weight:600;
  color:var(--ink-soft);
  transition:all .25s var(--ease-decel);
  margin-right:6px;
  pointer-events:none;
}
.custom-attribution:hover .custom-attribution-content,
.custom-attribution.expanded .custom-attribution-content{
  max-width:440px;
  opacity:1;
  padding:4px 12px;
  pointer-events:auto;
}
.custom-attribution-content a{
  color:var(--brand-d);
  text-decoration:none;
  font-weight:700;
  margin:0 2px;
}
.custom-attribution-content a:hover{
  text-decoration:underline;
}

@media (prefers-color-scheme: dark){
  .custom-attribution-btn{
    background:#1e242c;
    color:#eef1f4;
    border-color:#343c46;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .custom-attribution-content{
    background:rgba(23, 27, 33, 0.95);
    border-color:#262c34;
    color:#a3adb8;
  }
}

/* ---------- SIDEBAR PANEL ---------- */
#panel{
  width:380px;flex-shrink:0;background:var(--bg);border-left:1px solid var(--line);
  overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;
}
#panel .empty{color:var(--ink-soft);font-size:13px;padding-top:4px}
#panel .empty .material-symbols-outlined{display:block;font-size:32px;margin:0 0 10px;opacity:.4;color:var(--brand)}
#panel h2{font-size:18px;font-weight:900;margin:0 0 2px;letter-spacing:-.01em;line-height:1.25}
.panel-sub{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:8px}

.panel-card{background:var(--bg-alt);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:6px}
.panel-card-title{
  font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
  margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;
}
.panel-card-title .material-symbols-outlined{font-size:15px;margin:0}

.stat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:5px}
.stat-row .k .material-symbols-outlined{font-size:15px;color:var(--ink-soft);margin:0}
.stat-row .v{font-weight:700;text-align:right;color:var(--ink)}
.stat-row .v a{color:var(--brand-d);text-decoration:none;font-weight:700}
.stat-row .v a:hover{text-decoration:underline;color:var(--brand)}

.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap}

.acc-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;line-height:1}
.acc-pill .material-symbols-outlined{font-size:13px;margin:0}
.acc-pill.yes{background:var(--tint-verde);color:#00944e;border:1px solid rgba(0,201,107,.3)}
.acc-pill.no{background:var(--tint-rojo);color:var(--c-alertas);border:1px solid rgba(211,47,47,.3)}
.acc-pill.unk{background:var(--tint-rojo);color:var(--c-alertas);border:1px dashed rgba(211,47,47,.4);opacity:.9}

.emptycell{color:var(--ink-soft);font-style:italic;font-size:11.5px}
.emptycell.red{color:var(--c-alertas);font-weight:700;font-style:normal;display:inline-flex;align-items:center;gap:3px}

.maps-btn{
  display:inline-flex;align-items:center;gap:5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  text-decoration:none;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;
  transition:all .15s var(--ease-standard);box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.maps-btn:hover{background:var(--bg-alt);border-color:var(--ink-soft);color:var(--ink);transform:translateY(-1px)}
.maps-btn .material-symbols-outlined{font-size:15px;margin:0;color:var(--ink-soft)}

.clear-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:8px;border-radius:8px;background:var(--bg-alt);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;margin-top:10px;transition:background .15s;
}
.clear-btn:hover{background:var(--line);color:var(--ink)}

/* Overview KPI grid in Panel */
.panel-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.panel-kpi{background:var(--bg-alt);border:1px solid var(--line);border-radius:10px;padding:10px}
.panel-kpi-val{font-size:18px;font-weight:900;color:var(--brand-d);line-height:1.1}
.panel-kpi-lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-top:2px}

.barrio-inst-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;margin-top:8px}
.barrio-inst-item{
  display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;cursor:pointer;transition:all .15s var(--ease-standard);text-align:left;
}
.barrio-inst-item:hover{border-color:var(--brand);background:var(--brand-bg)}
.barrio-inst-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.barrio-inst-item .name{font-size:11.5px;font-weight:700;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrio-inst-item .badge-s{font-size:10px;font-weight:700;color:var(--ink-soft)}

.layer-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:3.5px 0;font-weight:600;font-size:11.5px;cursor:pointer}
.layer-toggle-row input{accent-color:var(--brand);width:14px;height:14px;cursor:pointer}
.layer-indicator{display:inline-flex;align-items:center;gap:6px}
.layer-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* ---------- FLOATING FILTERS ---------- */
.filters{
  position:absolute;left:14px;bottom:14px;background:var(--bg);border:1px solid var(--line);
  box-shadow:0 4px 20px rgba(0,0,0,.14);z-index:400;width:290px;max-height:calc(100% - 28px);
  border-radius:14px;padding:14px 16px;font-size:12px;
  transition:all .25s var(--ease-decel);overflow-y:auto;overflow-x:hidden;
}

/* Estado Minimizado */
.filters.minimized{
  width:auto;min-width:190px;max-width:240px;height:38px;max-height:38px;
  padding:0 14px;border-radius:999px;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 3px 14px rgba(0,0,0,.15);user-select:none;
}
.filters.minimized:hover{background:var(--bg-alt)}

.filters-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:pointer;user-select:none;padding-bottom:8px;border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.filters.minimized .filters-header{padding-bottom:0;border-bottom:none;margin-bottom:0;width:100%}
.filters-header-title{
  font-weight:800;font-size:11.5px;color:var(--ink);display:flex;align-items:center;gap:6px;
  letter-spacing:.03em;text-transform:uppercase;
}
.filters-header-title .material-symbols-outlined{font-size:16px;color:var(--brand-d)}
.filters-toggle-btn{
  background:transparent;border:none;padding:2px 4px;border-radius:6px;
  color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.filters-toggle-btn:hover{background:var(--line);color:var(--ink)}
.filters.minimized .filters-content{display:none}

.filter-group{margin-bottom:10px}
.filter-group:last-child{margin-bottom:0}
.filter-lbl{font-weight:800;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.filter-select, .filter-input{
  width:100%;padding:6px 10px;font-size:12px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg-alt);color:var(--ink);font-weight:600;outline:none;font-family:inherit;
}
.filter-select:focus, .filter-input:focus{border-color:var(--brand)}

.filter-footer-info{font-size:11px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}

@media (max-width:980px){
  .topbar-search-wrap{max-width:100%;order:3;width:100%;margin-top:4px}
}

@media (max-width:760px){
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:500;box-shadow:-4px 0 16px rgba(0,0,0,.15);width:310px}
  #panel.hidden{display:none}
  .app{position:relative}
  .filters{width:220px;bottom:10px;left:10px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="logo">

        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])){
          lat = parts[0];
          lng = parts[1];
        }
      }
      return { ...d, id: i, lat, lng };
    });
  }

      L.DomEvent.disableScrollPropagation(container);

      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        container.classList.toggle('expanded');
      });
      return container;
    }
  });
  map.addControl(new CollapsibleAttribution());

  // Capa Barrios GeoJSON
  let selectedBarrio = null;
  const barriosGeoLayer = L.geoJSON(typeof BARRIOS_GEOJSON !== 'undefined' ? BARRIOS_GEOJSON : {type:'FeatureCollection',features:[]}, {
    style: function(feature){
      return {
        color: '#0079ac',
        weight: 1.5,
        opacity: 0.65,
        dashArray: '3, 4',
        fillColor: '#009DE0',
        fillOpacity: 0.04,
      };
    },
    onEachFeature: function(feature, layer){
      const barrioName = feature.properties.nombre;
      const count = items.filter(d=>norm(d.barrio)===norm(barrioName)).length;
      layer.bindTooltip(`<strong>${esc(barrioName)}</strong><br><span style="font-size:11px;color:#5b6470">${count} instituciones educativas</span>`, {
        direction: 'top', sticky: true
      });
      layer.on('mouseover', function(){
        if(selectedBarrio !== norm(barrioName)){
          layer.setStyle({ weight: 2.5, opacity: 0.85, fillOpacity: 0.14, color: '#005b82' });
        }
      });
      layer.on('mouseout', function(){
        if(selectedBarrio !== norm(barrioName)){
          barriosGeoLayer.resetStyle(layer);
        }
      });
      layer.on('click', function(){
        selectBarrioFeature(feature, layer);
      });
    }
  }).addTo(map);

  document.getElementById('layerBarrios').addEventListener('change', e=>e.target.checked?map.addLayer(barriosGeoLayer):map.removeLayer(barriosGeoLayer));

  function selectBarrioFeature(feature, layer){
    const barrioName = feature.properties.nombre;
    selectedBarrio = norm(barrioName);
    barriosGeoLayer.eachLayer(l => barriosGeoLayer.resetStyle(l));
    layer.setStyle({
      color: '#004360',
      weight: 3.5,
      opacity: 1,
      dashArray: null,
      fillColor: '#009DE0',
      fillOpacity: 0.22,
    });
    map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 15, animate: true });
    renderBarrioDetail(barrioName);
    document.getElementById('mBarrio').value = barrioName;
    updateMarkers();
  }

  // Marker Icon Creator
  function makeMarkerIcon(d){
    const color = NIVCOLOR[d.niv] || '#009DE0';
    const icon = NIVICON[d.niv] || 'school';
    return L.divIcon({
      className: '',
      html: `<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);border:2px solid #ffffff;box-shadow:0 2px 7px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="transform:rotate(45deg);color:#ffffff;font-size:15px;margin:0">${icon}</span></div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 28],
    });
  }

  // Markers Layer Group
  const markersLayer = L.layerGroup().addTo(map);

  function matchesAcc(d, mode){
    if (!mode) return true;
    if (mode==='completa') return d.rampa==='Sí' && d.banio==='Sí' && d.silla==='Sí';
    if (mode==='rampa') return d.rampa==='Sí';
    if (mode==='banio') return d.banio==='Sí';
    if (mode==='silla') return d.silla==='Sí';
    if (mode==='sindato') return !d.rampa && !d.banio && !d.silla;
    return true;
  }

  function getFiltered(){
    const rawQ = (document.getElementById('topSearchInput').value || document.getElementById('mSearch').value).trim();
    const niv = document.getElementById('mNiv').value;
    const sec = document.getElementById('mSec').value;
    const acc = document.getElementById('mAcc').value;
    const barrio = document.getElementById('mBarrio').value;

    return items.filter(d => {
      if (d.lat == null || d.lng == null) return false;
      if (niv && d.niv !== niv) return false;
      if (sec && d.sec !== sec) return false;
      if (barrio && norm(d.barrio) !== norm(barrio)) return false;
      if (!matchesAcc(d, acc)) return false;
      if (rawQ){
        const terms = norm(rawQ).split(/\s+/).filter(Boolean);
        const hay = norm([
          d.nombre, d.director, d.barrio, d.loc, d.cue, d.dom, d.codEmp, 
          d.insp, d.niv, d.sec, d.mod, d.cat,
          'escuela colegio instituto jardin maternal fundacion sala cuna'
        ].filter(Boolean).join(' '));
        const matchesAll = terms.every(t => {
          if (hay.includes(t)) return true;
          if (['escuela','colegio','instituto','jardin','maternal','sala','cuna','fundacion'].includes(t)) return true;
          return false;
        });
        if (!matchesAll) return false;
      }
      return true;
    });
  }

  function updateMarkers(){
    markersLayer.clearLayers();
    const filtered = getFiltered();

    filtered.forEach(d => {
      const marker = L.marker([d.lat, d.lng], { icon: makeMarkerIcon(d) });

      const rampaOk = d.rampa === 'Sí';
      const banioOk = d.banio === 'Sí';
      const sillaOk = d.silla === 'Sí';
      const telOk = !!d.telCen;
      const mailOk = !!d.correoInst;
      const dirOk = !!d.telDir || !!d.director;

      marker.bindTooltip(`
        <div style="font-family:'Google Sans',sans-serif;padding:3px 1px;min-width:210px">
          <strong style="font-size:12.5px;color:#14171a">${esc(d.nombre)}</strong>
          <div style="font-size:11px;color:#5b6470;margin-top:2px">${esc(d.niv||'')} · ${esc(d.sec||'')} ${d.al24!=null ? '· <b>'+d.al24.toLocaleString('es-AR')+' al.</b>' : ''}</div>
          <div style="font-size:10.5px;color:#8892b0;margin-top:1px">${esc(d.dom||d.barrio||'')}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding-top:5px;border-top:1px solid #e5e8eb;font-size:10px;font-weight:700">

              <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${banioOk?'#00C96B':'#d32f2f'};box-shadow:0 0 0 1px ${banioOk?'rgba(0,201,107,.3)':'rgba(211,47,47,.3)'}" title="Baño: ${d.banio||'Sin dato'}"></span>
              <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${sillaOk?'#00C96B':'#d32f2f'};box-shadow:0 0 0 1px ${sillaOk?'rgba(0,201,107,.3)':'rgba(211,47,47,.3)'}" title="Silla: ${d.silla||'Sin dato'}"></span>
            </span>

              Contacto:
              <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${telOk?'#00C96B':'#d32f2f'};box-shadow:0 0 0 1px ${telOk?'rgba(0,201,107,.3)':'rgba(211,47,47,.3)'}" title="Tel. Centro: ${d.telCen||'Sin dato'}"></span>
              <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${mailOk?'#00C96B':'#d32f2f'};box-shadow:0 0 0 1px ${mailOk?'rgba(0,201,107,.3)':'rgba(211,47,47,.3)'}" title="Correo: ${d.correoInst||'Sin dato'}"></span>
              <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${dirOk?'#00C96B':'#d32f2f'};box-shadow:0 0 0 1px ${dirOk?'rgba(0,201,107,.3)':'rgba(211,47,47,.3)'}" title="Director/a: ${d.director||'Sin dato'}"></span>
            </span>
          </div>
        </div>
      `, { direction: 'top', sticky: true });

      marker.on('click', () => {
        selectInstitution(d);
      });

      markersLayer.addLayer(marker);
    });

    document.getElementById('mapCounter').textContent = `${filtered.length} de ${items.filter(d=>d.lat!=null).length} en el mapa`;
  }

  // Render Barrio Detail in Panel

  // Render General Overview in Panel

  function resetAll(){
    document.getElementById('topSearchInput').value = '';
    document.getElementById('topSearchClear').classList.remove('visible');
    closeDropdown();
    document.getElementById('mSearch').value = '';
    document.getElementById('mNiv').value = '';
    document.getElementById('mSec').value = '';
    document.getElementById('mAcc').value = '';
    document.getElementById('mBarrio').value = '';
    selectedBarrio = null;
    barriosGeoLayer.eachLayer(l => barriosGeoLayer.resetStyle(l));
    map.setView([-33.125, -64.35], 13);

    renderOverview();
  }

  // Search Bar with Live Autocomplete
  const topInput = document.getElementById('topSearchInput');
  const topClear = document.getElementById('topSearchClear');
  const dropdown = document.getElementById('searchDropdown');
  let selectedIndex = -1;

  function closeDropdown(){
    dropdown.classList.remove('open');
    dropdown.innerHTML = '';
    selectedIndex = -1;
  }

  function renderDropdown(q){
    if (!q || q.length < 1){
      closeDropdown();
      return;
    }
    const terms = norm(q).split(/\s+/).filter(Boolean);
    const matches = items.filter(d => {
      const hay = norm([
        d.nombre, d.director, d.barrio, d.loc, d.cue, d.dom, d.codEmp, 
        d.insp, d.niv, d.sec, d.mod, d.cat,
        'escuela colegio instituto jardin maternal fundacion sala cuna'
      ].filter(Boolean).join(' '));
      return terms.every(t => {
        if (hay.includes(t)) return true;
        if (['escuela','colegio','instituto','jardin','maternal','sala','cuna','fundacion'].includes(t)) return true;
        return false;
      });
    });

    if (matches.length === 0){
      dropdown.innerHTML = '<div class="search-no-results">No se encontraron instituciones educativas</div>';
      dropdown.classList.add('open');
      selectedIndex = -1;
      return;
    }

    const topMatches = matches.slice(0, 8);
    let html = topMatches.map((d, idx) => {
      const color = NIVCOLOR[d.niv] || '#009DE0';
      return `
        <div class="search-item" data-idx="${idx}" data-id="${d.id}">
          <span class="item-dot" style="background:${color}"></span>
          <div class="item-info">
            <div class="item-title">${esc(d.nombre)}</div>
            <div class="item-meta">${esc(d.niv||'Nivel sin dato')} · ${esc(d.sec||'')} ${d.barrio ? '· Barrio ' + esc(d.barrio) : (d.dom ? '· ' + esc(d.dom) : '')}</div>
          </div>
          <span class="item-badge" style="background:${color}18;color:${color}">${esc(d.niv||'')}</span>
        </div>
      `;
    }).join('');

    if (matches.length > 8){
      html += `<div class="search-dropdown-footer"><span>Viendo 8 de ${matches.length} resultados</span><span>Enter para filtrar todos</span></div>`;
    }

    dropdown.innerHTML = html;
    dropdown.classList.add('open');
    selectedIndex = -1;

    dropdown.querySelectorAll('.search-item').forEach(el => {
      el.addEventListener('click', () => {
        const dId = parseInt(el.dataset.id, 10);
        const item = items.find(d => d.id === dId);
        if (item){
          topInput.value = item.nombre;
          topClear.classList.add('visible');
          document.getElementById('mSearch').value = item.nombre;
          closeDropdown();
          if (item.lat != null && item.lng != null){
            updateMarkers();
            selectInstitution(item);
          }
        }
      });
    });
  }

  topInput.addEventListener('input', e => {
    const val = e.target.value;
    topClear.classList.toggle('visible', val.length > 0);
    document.getElementById('mSearch').value = val;
    updateMarkers();
    renderOverview();
    renderDropdown(val);
  });

  topInput.addEventListener('focus', () => {
    if (topInput.value.trim().length > 0){
      renderDropdown(topInput.value);
    }
  });

  topInput.addEventListener('keydown', e => {
    const itemsEl = dropdown.querySelectorAll('.search-item');
    if (!dropdown.classList.contains('open') || itemsEl.length === 0){
      if (e.key === 'Enter'){
        updateMarkers();
        renderOverview();
      }
      return;
    }

    if (e.key === 'ArrowDown'){
      e.preventDefault();
      selectedIndex = (selectedIndex + 1) % itemsEl.length;
      itemsEl.forEach((el, i) => el.classList.toggle('selected', i === selectedIndex));
      itemsEl[selectedIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      selectedIndex = (selectedIndex - 1 + itemsEl.length) % itemsEl.length;
      itemsEl.forEach((el, i) => el.classList.toggle('selected', i === selectedIndex));
      itemsEl[selectedIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (selectedIndex >= 0 && itemsEl[selectedIndex]){
        itemsEl[selectedIndex].click();
      } else {
        closeDropdown();
        updateMarkers();
        renderOverview();
      }
    } else if (e.key === 'Escape'){
      closeDropdown();
    }
  });

  topClear.addEventListener('click', () => {
    topInput.value = '';
    topClear.classList.remove('visible');
    document.getElementById('mSearch').value = '';
    closeDropdown();
    topInput.focus();
    updateMarkers();
    renderOverview();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.topbar-search-wrap')){
      closeDropdown();
    }
  });

  // Filter input event listeners
  document.getElementById('mSearch').addEventListener('input', e => {
    topInput.value = e.target.value;
    topClear.classList.toggle('visible', e.target.value.length > 0);
    updateMarkers();
    renderOverview();
  });

  ['mNiv','mSec','mAcc','mBarrio'].forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>{
      updateMarkers();
      renderOverview();
    });
  });
  document.getElementById('mReset').addEventListener('click', resetAll);

  // Floating Filter minimize toggle
  const filterBox = document.getElementById('filters');
  const filtersHeader = document.getElementById('filtersHeader');
  filtersHeader.addEventListener('click', ()=>{
    filterBox.classList.toggle('minimized');
    const isMin = filterBox.classList.contains('minimized');
    document.getElementById('filtersToggleBtn').innerHTML = isMin 
      ? '<span class="material-symbols-outlined">expand_less</span>' 
      : '<span class="material-symbols-outlined">expand_more</span>';
  });

  // ---------- GOOGLE SHEETS LIVE SYNC ----------
  const SPREADSHEET_ID = '15Nu4IciwJBoOsVYh_01PGa4x96hGH9Jy-xSA0qp1Y7E';

  function showToast(msg, isError = false) {
    let toast = document.getElementById('toastNotification');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toastNotification';
      toast.className = 'toast-msg';
      document.body.appendChild(toast);
    }
    toast.className = 'toast-msg' + (isError ? ' toast-err show' : ' show');
    toast.innerHTML = '<span class="material-symbols-outlined">' + (isError ? 'error' : 'check_circle') + '</span><span>' + esc(msg) + '</span>';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => {
      toast.classList.remove('show');
    }, 3500);
  }

  function parseGvizToData(table) {
    function cleanVal(v) {
      if (v == null) return null;
      const s = ('' + v).trim();
      if (s === '' || s === '-' || s === '---' || s.startsWith('_____') || s.toLowerCase() === 'null' || s.toLowerCase() === 'nan' || s.toLowerCase() === 's/d' || s.toLowerCase() === 'sin dato') return null;
      return s;
    }
    function cleanPhone(v) {
      const c = cleanVal(v);
      if (!c) return null;
      if (c.toLowerCase() === 'no' || c.toLowerCase() === 'sin dato' || c.toLowerCase() === 's/d' || c.startsWith('_') || c.startsWith('-')) return null;
      return c;
    }
    function cleanNum(v) {
      const c = cleanVal(v);
      if (!c) return null;
      const num = parseInt(('' + c).replace(/[^0-9-]/g, ''), 10);
      return isNaN(num) ? null : num;
    }
    function cleanAcc(v) {
      const c = cleanVal(v);
      if (!c) return null;
      const lower = c.toLowerCase();
      if (lower === 'si' || lower === 'sí') return 'Sí';
      if (lower === 'no') return 'No';
      return c;
    }

    return table.rows.map(r => {
      const c = r.c || [];
      const getV = idx => (c[idx] ? (c[idx].v !== undefined ? c[idx].v : c[idx].f) : null);
      return {
        mod: cleanVal(getV(0)),
        niv: cleanVal(getV(1)),
        sec: cleanVal(getV(2)),
        amb: cleanVal(getV(3)),
        cue: cleanVal(getV(4)),
        codInsp: cleanVal(getV(5)),
        insp: cleanVal(getV(6)),
        telInsp: cleanPhone(getV(7)),
        codEmp: cleanVal(getV(8)),
        turno: cleanVal(getV(9)),
        nombre: cleanVal(getV(10)) ? cleanVal(getV(10)).replace(/\s*\(\*\*\)\s*$/, "").trim() : null,
        coords: cleanVal(getV(11)),
        dom: cleanVal(getV(12)),
        loc: cleanVal(getV(13)),
        barrio: cleanVal(getV(14)),
        depto: cleanVal(getV(15)),
        telCen: cleanPhone(getV(16)),
        correoInst: cleanVal(getV(17)),
        director: cleanVal(getV(18)),
        telDir: cleanPhone(getV(19)),
        correoPers: cleanVal(getV(20)),
        cat: cleanVal(getV(21)),
        sillaUrg: cleanVal(getV(22)),
        al24: cleanNum(getV(23)),
        al25: cleanNum(getV(24)),
        alDisc: cleanNum(getV(25)),
        rampa: cleanAcc(getV(26)),
        banio: cleanAcc(getV(27)),
        silla: cleanAcc(getV(28))
      };
    }).filter(d => d.nombre);
  }

  function fetchLiveBudieData() {
    return new Promise((resolve, reject) => {
      const cbName = 'handleBudieSyncMap_' + Date.now();
      const gvizUrl = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=responseHandler:' + cbName + '&tq=' + encodeURIComponent('select *') + '&_ts=' + Date.now();

      fetch('https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:json&_ts=' + Date.now(), { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(text => {
          const jsonStr = text.replace(/^[^{]*\(/, '').replace(/\);?$/, '');
          const json = JSON.parse(jsonStr);
          resolve(parseGvizToData(json.table));
        })
        .catch(() => {
          const script = document.createElement('script');
          let done = false;
          window[cbName] = function(json) {
            done = true;
            delete window[cbName];
            script.remove();
            resolve(parseGvizToData(json.table));
          };
          script.onerror = function() {
            if (!done) {
              delete window[cbName];
              script.remove();
              reject(new Error('No se pudo conectar con la base de datos'));
            }
          };
          script.src = gvizUrl;
          document.head.appendChild(script);
        });
    });
  }

  function refreshFilterOptions() {
    function repopulate(id, values, currentVal) {
      const sel = document.getElementById(id);
      if (!sel) return;
      const firstOption = sel.options[0];
      sel.innerHTML = '';
      sel.appendChild(firstOption);
      values.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        if (v === currentVal) o.selected = true;
        sel.appendChild(o);
      });
    }
    repopulate('mNiv', uniq(items.map(d=>d.niv)), document.getElementById('mNiv').value);
    repopulate('mSec', uniq(items.map(d=>d.sec)), document.getElementById('mSec').value);
    repopulate('mBarrio', uniq(items.map(d=>d.barrio)), document.getElementById('mBarrio').value);
  }

  const btnSync = document.getElementById('btnSync');
  if (btnSync) {
    btnSync.addEventListener('click', async () => {
      const txt = btnSync.querySelector('.sync-text');
      btnSync.classList.remove('success', 'error');
      btnSync.classList.add('loading');
      if (txt) txt.textContent = 'Actualizando…';

      try {
        const freshData = await fetchLiveBudieData();
        if (!freshData || !freshData.length) throw new Error('Base de datos sin registros');
        DATA = freshData;
        rebuildItems();
        refreshFilterOptions();
        updateMarkers();
        renderOverview();

        btnSync.classList.remove('loading');
        btnSync.classList.add('success');
        if (txt) txt.textContent = '¡Actualizado!';
        showToast('Base de datos actualizada: ' + freshData.length + ' instituciones');

        setTimeout(() => {
          btnSync.classList.remove('success');
          if (txt) txt.textContent = 'Actualizar';
        }, 2500);
      } catch (err) {
        console.error(err);
        btnSync.classList.remove('loading');
        btnSync.classList.add('error');
        if (txt) txt.textContent = 'Error';
        showToast(err.message || 'Error al actualizar', true);

        setTimeout(() => {
          btnSync.classList.remove('error');
          if (txt) txt.textContent = 'Actualizar';
        }, 3000);
      }
    });
  }

  // Initial render
  updateMarkers();
  renderOverview();
})();
</script>
</body>
</html>
